    <script>
      // Evita flash de tema errado antes do React montar.
      try {
        var t = localStorage.getItem("nexo:theme");
        var dark = t ? JSON.parse(t) === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
